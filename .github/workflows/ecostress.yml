name: Night-time surface heat (NASA ECOSTRESS)

# Builds the night-time surface heat summaries (ecostress.py) with the NASA Earthdata token, the secret night lights uses (HANDOFF decisions 75 and 80;
# docs/nightlights-setup.md), and keeps the files with the run as an artifact; it writes nothing to the repository. Started by hand, or by pushing a tag
# named ecostress-run-*; a tag named ecostress-diag-* only checks what the LP DAAC answers and the layout of one granule's layers.
on:
  workflow_dispatch:
  push:
    tags: ["ecostress-run-*", "ecostress-diag-*"]

permissions:
  contents: read

concurrency:
  group: ecostress
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: What the LP DAAC answers, and one granule's layers (diag tags only; never prints the token)
        if: startsWith(github.ref_name, 'ecostress-diag-')
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: python -u ecostress.py --diagnose
      - name: Per-granule values of earlier runs (so a run reads only the granules it has not read)
        if: "!startsWith(github.ref_name, 'ecostress-diag-')"
        uses: actions/cache/restore@v4
        with:
          path: cache/ecostress
          key: ecostress-values-${{ github.run_id }}
          restore-keys: ecostress-values-
      - name: Build
        if: "!startsWith(github.ref_name, 'ecostress-diag-')"
        env:
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: |
          test -n "$EARTHDATA_TOKEN" || { echo "::error::The secret EARTHDATA_TOKEN is not set (docs/nightlights-setup.md)."; exit 1; }
          python -u ecostress.py
          python ecostress.py --check
      - name: Save the per-granule values, even when the build stopped (a later run goes on from them)
        if: always() && !startsWith(github.ref_name, 'ecostress-diag-')
        uses: actions/cache/save@v4
        with:
          path: cache/ecostress
          key: ecostress-values-${{ github.run_id }}
      - name: Keep the files, and the per-granule values for a check elsewhere, with the run
        if: "!startsWith(github.ref_name, 'ecostress-diag-')"
        uses: actions/upload-artifact@v4
        with:
          name: ecostress-${{ github.run_id }}
          path: |
            site/data/night_heat_series.json
            site/data/night_heat_barrio.json
            site/data/night_heat_surface.json
            site/data/night_heat_surface.png
            cache/ecostress
          if-no-files-found: error
          retention-days: 30
