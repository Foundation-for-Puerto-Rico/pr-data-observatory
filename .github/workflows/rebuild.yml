name: Rebuild a data source

# Started by freshness.yml when a source has a new release, or by hand. Rebuilds one unit of refresh/sources.json on a clean runner,
# keeps the result only when the data really changed (not just the build date), moves the declared last year forward
# (dictionary_src/datasets.json), runs the contract, and opens a pull request as the observatory's GitHub App (docs/automation.md).
# Routine sources ("auto" in refresh/sources.json) merge when the required checks pass; the others wait for a person.
on:
  workflow_dispatch:
    inputs:
      unit:
        description: "What to rebuild"
        type: choice
        options: [medicare, infrastructure, environment, health, gateways, facilities, nonprofits, conditions, community, landslide, heat, vegetation, buildings, night_heat, reservoirs, nightlights, fires, broadband, spending, oz, transit_links, traffic, crashes, energy, inventories, credit, drought]
      sources:
        description: "The sources with a new release, comma-separated (they decide whether a person must review)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: rebuild-${{ inputs.unit }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.unit == 'nightlights' && 330 || 90 }}   # night-time lights: a run without the cached summaries downloads every month since 2012 (about 12 GB, one file at a time)
    steps:
      - name: The observatory App's token (when it is set up)
        id: app
        if: vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Night-time lights' monthly summaries (so a run downloads only the new months)
        if: inputs.unit == 'nightlights'
        uses: actions/cache@v4
        with:
          path: cache/nightlights/summary
          key: nightlights-summary-${{ github.run_id }}
          restore-keys: nightlights-summary-
      - name: Broadband's block summaries, census blocks and barrio placement (so a run downloads only a new June release)
        if: inputs.unit == 'broadband'
        uses: actions/cache@v4
        with:
          path: |
            cache/broadband
            cache/network/census_blocks_ids.json
            cache/geo
          key: broadband-${{ github.run_id }}
          restore-keys: broadband-
      - name: Surface heat's Landsat tiles (so a run downloads only the scenes it has not read)
        if: inputs.unit == 'heat'
        uses: actions/cache@v4
        with:
          path: cache/heat
          key: heat-tiles-${{ github.run_id }}
          restore-keys: heat-tiles-
      - name: Fires' downloaded detections (yearly files and the last 12 months)
        if: inputs.unit == 'fires'
        uses: actions/cache@v4
        with:
          path: cache/fires
          key: fires-${{ github.run_id }}
          restore-keys: fires-
      - name: The 3D view's building tiles from Overture (Puerto Rico, zooms 13-14; a new release replaces them)
        if: inputs.unit == 'buildings'
        uses: actions/cache@v4
        with:
          path: cache/buildings3d
          key: buildings3d-${{ github.run_id }}
          restore-keys: buildings3d-
      - name: Buildings' Overture download (points, areas and sources only; a new release replaces it)
        if: inputs.unit == 'buildings'
        uses: actions/cache@v4
        with:
          path: cache/buildings
          key: buildings-${{ github.run_id }}
          restore-keys: buildings-
      - name: Vegetation's per-scene Sentinel-2 values (so a run reads only the scenes it has not read)
        if: inputs.unit == 'vegetation'
        uses: actions/cache@v4
        with:
          path: cache/vegetation
          key: vegetation-values-${{ github.run_id }}
          restore-keys: vegetation-values-
      - name: Night heat's per-granule ECOSTRESS values (so a run reads only the granules it has not read)
        if: inputs.unit == 'night_heat'
        uses: actions/cache@v4
        with:
          path: cache/ecostress
          key: ecostress-values-${{ github.run_id }}
          restore-keys: ecostress-values-
      - name: Rebuild
        env:
          UNIT: ${{ inputs.unit }}
          EARTHDATA_TOKEN: ${{ (inputs.unit == 'nightlights' || inputs.unit == 'night_heat') && secrets.EARTHDATA_TOKEN || '' }}   # HANDOFF decisions 75 and 80: the NASA Earthdata token, for the night-time lights and night heat builds only (docs/nightlights-setup.md)
          FIRMS_MAP_KEY: ${{ inputs.unit == 'fires' && secrets.FIRMS_MAP_KEY || '' }}   # HANDOFF decision 91: NASA FIRMS's MAP_KEY, for the last 12 months of fire detections (docs/fires.md)
          FCC_BDC_USERNAME: ${{ inputs.unit == 'broadband' && secrets.FCC_BDC_USERNAME || '' }}   # HANDOFF decision 94: FPR's FCC account, for the broadband build only (docs/broadband.md)
          FCC_BDC_HASH: ${{ inputs.unit == 'broadband' && secrets.FCC_BDC_HASH || '' }}
        run: |
          python - <<'PY' > .rebuild.sh
          import json, os
          u = json.load(open("refresh/sources.json", encoding="utf-8"))["units"][os.environ["UNIT"]]
          assert u["where"] == "ci", "this unit is not rebuilt on a runner"
          print("set -e"); print("\n".join(u["runs"]))
          PY
          bash .rebuild.sh; rm .rebuild.sh
      - name: Did the data change?
        id: changed
        run: |
          if python freshness.py --changed-unit "${{ inputs.unit }}"; then echo "yes=1" >> "$GITHUB_OUTPUT"; else
            echo "The rebuild of ${{ inputs.unit }} gave the same data as the published files (only the build date differs). Nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Years, dictionary, catalog, contract
        if: steps.changed.outputs.yes == '1'
        run: |
          python freshness.py --sync-time | tee .years_moved
          python dictionary.py
          python catalog.py
          python registry.py
          python i18n.py --check
          python contract.py
          python budget.py
      - name: Open a pull request
        if: steps.changed.outputs.yes == '1'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          UNIT: ${{ inputs.unit }}
          SOURCES: ${{ inputs.sources }}
        run: |
          review=$(python freshness.py --review "$UNIT" $(echo "$SOURCES" | tr ',' ' '))
          moved=$(grep -- '->' .years_moved || true); rm -f .years_moved
          [ -z "$moved" ] || review=human   # a dataset now reaches a later year: a new vintage, always reviewed
          if [ -n "$APP_SLUG" ]; then
            uid=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
            git config user.name "${APP_SLUG}[bot]"; git config user.email "${uid}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          day=$(date -u +%F)
          branch="bot/rebuild-${UNIT}-${day}-${{ github.run_id }}"
          git switch -c "$branch"
          git add site/data dictionary_src/datasets.json dictionary_src/data_ledger.json   # the ledger moves the last-updated date of each file whose content changed (registry.py)
          git commit -m "Rebuild ${UNIT} data ${day} (${SOURCES:-by hand})"
          git push -u origin "$branch"
          if [ -z "$APP_SLUG" ]; then
            echo "::warning::The observatory App is not set up (docs/automation.md), so no pull request was opened. Open one from ${branch} by hand."
            echo "New ${UNIT} data on \`${branch}\`: open a pull request by hand (the observatory App is not set up yet)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$review" = "auto" ]; then
            note="Routine source: this pull request merges itself when the required checks pass."
          else
            note="**A person reviews this before it merges**: a new vintage, a licence under review or public money (refresh/sources.json, \"review\").${moved:+ Years moved: ${moved}.}"
          fi
          # a newer rebuild of the same data replaces an older one that is still open
          for n in $(gh pr list --state open --json number,headRefName --jq ".[] | select(.headRefName | startswith(\"bot/rebuild-${UNIT}-\")) | .number"); do
            gh pr close "$n" --delete-branch --comment "Superseded by a newer rebuild of the same data (run ${{ github.run_id }})."
          done
          title="Rebuild ${UNIT} data ${day}"; [ "$review" = "auto" ] || title="[review] ${title}"
          gh pr create --base main --head "$branch" --title "$title" \
            --body "New release of: ${SOURCES:-(started by hand)}. Rebuilt by rebuild.yml (run ${{ github.run_id }}) on a clean runner; the data changed beyond the build date, the declared years were moved forward where a file now reaches a later year, and the contract passed. ${note}"
          if [ "$review" = "auto" ]; then gh pr merge "$branch" --auto --merge; fi
