name: Refresh transit data

# Every night, re-read the public transit feeds (ATI, municipal GTFS from the National RTAP portal, OpenStreetMap routes)
# and publish only if something changed. Run by hand from the Actions tab with "Run workflow".
#
# main only takes pull requests (CONTRIBUTING.md), and the FPR organization does not let the workflow's own token open them.
# So the job acts as the observatory's GitHub App (docs/automation.md): it opens a pull request with the App's token, which starts
# tests.yml like any other pull request, and turns on auto-merge, so GitHub merges it only after the required "checks" pass.
# The merge then publishes the site (pages.yml runs on every push to main that touches site/).
# Until the App is set up (repository variable BOT_APP_ID and secret BOT_APP_PRIVATE_KEY), the job pushes its branch and
# leaves a note in the run summary: open the pull request from that branch by hand.
on:
  schedule:
    - cron: "17 8 * * *"   # 04:17 in Puerto Rico
  workflow_dispatch:
    inputs:
      allow_drop:
        description: "Publish even if a count fell by more than a quarter (only after a person checked why)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-transit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: The observatory App's token (when it is set up)
        id: app
        if: vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-refresh.txt
      - run: pip install -r requirements-refresh.txt
      - name: Keep the last good copy of every feed
        uses: actions/cache@v4
        with:
          path: |
            cache/network
            cache/geo
            cache/dem
          key: transit-network-${{ github.run_id }}
          restore-keys: transit-network-
      - name: Refresh the transit network
        run: python -u refresh_network.py
      # Checked here before anything leaves the runner; tests.yml checks the pull request again.
      - name: Data checks (counts against the published copy, privacy)
        run: python check_refresh.py ${{ inputs.allow_drop && '--allow-drop' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Contract and browser-code tests
        run: |
          python contract.py
          node --test tests/*.test.js
      - name: Open a pull request if the data changed
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          if [ -z "$(git status --porcelain site/data dictionary_src/data_ledger.json)" ]; then
            echo "No change in the transit feeds."; exit 0
          fi
          if [ -n "$APP_SLUG" ]; then
            uid=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${uid}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fi
          day=$(date -u +%F)
          branch="bot/refresh-transit-${day}-${{ github.run_id }}"   # unique, so a second run on the same day does not collide
          git switch -c "$branch"
          git add site/data dictionary_src/data_ledger.json   # the ledger: the last-updated date of each file whose content changed (registry.py, run by refresh_network.py)
          git commit -m "Refresh transit data ${day}"
          git push -u origin "$branch"
          if [ -z "$APP_SLUG" ]; then
            echo "::warning::The observatory App is not set up (docs/automation.md), so no pull request was opened. Open one from ${branch} by hand."
            echo "Transit data changed. Open a pull request from \`${branch}\` by hand: the observatory App is not set up yet (docs/automation.md)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr create --base main --head "$branch" --title "Refresh transit data ${day}" \
            --body "Nightly refresh by refresh-transit.yml (run ${{ github.run_id }}). The data checks, the contract and the browser-code tests passed in the run; tests.yml checks this pull request again, and it merges itself when they pass."
          gh pr merge "$branch" --auto --merge --delete-branch
